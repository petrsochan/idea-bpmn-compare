name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webview/package-lock.json

      # also validates the Gradle wrapper and caches Gradle + the downloaded IntelliJ IDEA
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build, test and verify plugin structure
        run: ./gradlew buildPlugin test verifyPluginStructure

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v7
        with:
          name: idea-bpmn-compare-${{ github.sha }}
          path: build/distributions/*.zip
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/
