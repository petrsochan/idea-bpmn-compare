name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  # weekly, so a new IDE release breaking the Plugin Verifier shows up even without a commit
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # the job name is a required status check in the `main` ruleset - keep them in sync
    name: Build plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webview/package-lock.json

      # also validates the Gradle wrapper and caches Gradle + the downloaded IntelliJ IDEA
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # verifyPlugin downloads the target IDEs (~2 GB) and takes several minutes; the Gradle cache
      # set up above keeps that cost to the first run on a given cache key.
      - name: Build, test and verify the plugin
        run: ./gradlew buildPlugin check verifyPluginStructure verifyPlugin

      # known vulnerabilities in what ends up in the plugin (dev tools like esbuild are not shipped)
      - name: Audit bundled npm dependencies
        working-directory: webview
        run: npm audit --omit=dev --audit-level=high

      - name: Upload verifier report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-verifier-report
          path: build/reports/pluginVerifier

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: idea-bpmn-compare-${{ github.sha }}
          path: build/distributions/*.zip
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: build/reports/
