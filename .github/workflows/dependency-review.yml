name: Dependency review

# Fails a pull request that adds or upgrades to a dependency with a known vulnerability.
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    # the job name is a required status check in the `main` ruleset - keep them in sync
    name: Dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the summary comment on a failing PR
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
