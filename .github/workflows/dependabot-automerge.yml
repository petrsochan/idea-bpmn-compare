name: Dependabot auto-merge

# Turns on auto-merge for low-risk Dependabot PRs: patch/minor updates of build tooling, test
# libraries and actions. GitHub merges them once the required checks of the `main` ruleset pass.
# bpmn-js and bpmn-js-differ are never merged automatically - they change what the diff view shows.
on:
  pull_request:

permissions:
  contents: read

jobs:
  automerge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Read Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge
        if: >-
          steps.meta.outputs.update-type != 'version-update:semver-major'
          && !contains(steps.meta.outputs.dependency-names, 'bpmn-js')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
