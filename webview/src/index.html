<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BPMN Compare</title>
  <link rel="stylesheet" href="bundle.css">
</head>
<body>
<div id="app">
  <div id="summary">
    <button type="button" class="chip added" data-kind="added" aria-pressed="true"><i></i>Added <b>0</b></button>
    <button type="button" class="chip removed" data-kind="removed" aria-pressed="true"><i></i>Removed <b>0</b></button>
    <button type="button" class="chip changed" data-kind="changed" aria-pressed="true"><i></i>Changed <b>0</b></button>
    <button type="button" class="chip layout" data-kind="layout" aria-pressed="true"><i></i>Moved <b>0</b></button>
    <span id="summary-note"></span>
    <!-- titles of the change-nav and zoom buttons are set from main.js: they depend on whether the
         button is currently usable, and the wording must not be duplicated here -->
    <div id="change-nav">
      <button id="change-prev" class="bar-button" type="button">&lsaquo;</button>
      <button id="change-next" class="bar-button" type="button">&rsaquo;</button>
    </div>
    <div id="zoom">
      <button id="zoom-out" class="bar-button" type="button">−</button>
      <button id="zoom-reset" class="bar-button" type="button">100%</button>
      <button id="zoom-in" class="bar-button" type="button">+</button>
      <button id="zoom-fit" class="bar-button" type="button">Fit</button>
    </div>
    <!-- title is set from main.js, so the wording lives in one place and follows the open/closed state -->
    <button id="toggle-changes" class="bar-button" type="button">Changes list</button>
    <div id="export-wrap">
      <button id="export" class="bar-button" type="button" data-tip="Export the diagram or the change list">Export</button>
      <ul id="export-menu" hidden>
        <li data-command="copyMarkdown">Copy change list as Markdown</li>
        <li data-command="saveSvg">Save left diagram as SVG…</li>
        <li data-command="savePng">Save left diagram as PNG…</li>
      </ul>
    </div>
  </div>

  <div id="panes">
    <section class="pane" id="pane-left">
      <header><span class="side">Current</span><span class="label"></span></header>
      <div class="canvas"></div>
      <div class="message"></div>
      <div class="ghost-cursor"></div>
    </section>
    <section class="pane" id="pane-right">
      <header><span class="side">Revision</span><span class="label"></span></header>
      <div class="canvas"></div>
      <div class="message"></div>
      <div class="ghost-cursor"></div>
    </section>
  </div>

  <aside id="changes" hidden>
    <ul id="change-list"></ul>
  </aside>

  <!-- tooltips are drawn here, not by the browser: see the tooltips section of main.js -->
  <div id="tip" role="tooltip" hidden></div>
</div>
<script src="bundle.js"></script>
</body>
</html>
